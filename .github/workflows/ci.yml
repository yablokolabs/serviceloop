name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.json

      - name: Install Chromium for the browser test
        run: npx playwright-core install --with-deps chromium

      - name: Tests (secret-free, no live model calls)
        run: npm run test:ci

      - name: Build API and web bundle
        run: |
          npm run build
          npx vite build --config apps/web/vite.config.ts apps/web

      # Delivery step: the built output is published as a run artifact.
      # No deploy target exists yet (demo repo, submission by repo + video),
      # so nothing is pushed to any host from CI.
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: serviceloop-dist
          path: |
            dist
            apps/web/dist
          retention-days: 14

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Geist, system-ui, sans-serif; background: #fafaf9; color: #0b2233;
    width: 1920px; height: 1080px; display: flex; overflow: hidden; }
  .left { width: 1060px; padding: 64px 0 64px 110px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 22px; animation: rise .6s .2s both; }
  .brand img { height: 74px; background: #fff; border-radius: 16px; padding: 8px 14px;
    box-shadow: 0 10px 30px rgba(15,61,92,.12); }
  .brand span { font-size: 26px; letter-spacing: 4px; color: #64748b; font-weight: 600; }
  .eyebrow { font-size: 34px; color: #ef5b45; font-weight: 600; margin: 54px 0 18px; animation: rise .6s .5s both; }
  h1 { font-size: 132px; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; animation: rise .6s .7s both; }
  h1 em { font-style: normal; color: #ef5b45; }
  .sub { font-size: 42px; color: #475569; margin-top: 26px; animation: rise .6s .9s both; }
  .pill { display: inline-block; align-self: flex-start; margin-top: 44px; font-size: 30px; font-weight: 600;
    color: #0f3d5c; background: #eef4f8; border-radius: 999px; padding: 14px 34px; animation: rise .6s 1.1s both; }
  .right { flex: 1; background: linear-gradient(150deg, #0b2233 0%, #0f3d5c 55%, #14506f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; padding: 60px; }
  .chat { width: 560px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    border-radius: 28px; padding: 36px; backdrop-filter: blur(4px); }
  .b { max-width: 86%; border-radius: 22px; padding: 20px 26px; font-size: 29px; line-height: 1.4;
    margin-bottom: 20px; opacity: 0; animation: rise .5s both; }
  .b:last-child { margin-bottom: 0; }
  .b.them { background: #fff; color: #0b2233; }
  .b.me { background: #ef5b45; color: #fff; margin-left: auto; }
  .b:nth-child(1) { animation-delay: 1.4s; } .b:nth-child(2) { animation-delay: 2.2s; } .b:nth-child(3) { animation-delay: 3s; }
  .waves { display: flex; align-items: center; gap: 9px; height: 110px; }
  .waves i { width: 13px; border-radius: 7px; background: #fff; animation: eq 1.1s ease-in-out infinite alternate; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  .cap { color: #9fb8cc; font-size: 28px; animation: rise .6s 1.3s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
</style></head><body>
  <div class="left">
    <div class="brand"><img src="file:///home/azureuser/serviceloop/apps/web/public/serviceloop-logo.png" alt=""><span>SERVICELOOP</span></div>
    <div class="eyebrow">ServiceLoop · workshop booking</div>
    <h1>Stop chasing.<br><em>Start scheduling.</em></h1>
    <div class="sub">Car-service booking by conversation.</div>
    <div class="pill">About 2½ min</div>
  </div>
  <div class="right">
    <div class="chat">
      <div class="b me">service Saturday morning with pickup at 10</div>
      <div class="b them">1 slot fits. Pickup 10:00, service 10:30.</div>
      <div class="b me">Approved ✓</div>
    </div>
    <div class="waves" id="w"></div>
    <div class="cap">One conversation, start to booked</div>
  </div>
  <script>
    const w = document.getElementById('w');
    const hs = [46,80,60,100,72,52,92,64,40,84,70,104,58,76,96,50,88,66,42,80,74,98,56,68,90,48,82,62,72,60];
    hs.forEach((h, i) => { const b = document.createElement('i'); b.style.height = h + 'px';
      b.style.animationDelay = (i * 0.07) + 's'; b.style.opacity = 0.35 + (h / 160); w.appendChild(b); });
  </script>
</body></html>

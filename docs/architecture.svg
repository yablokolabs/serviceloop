<svg xmlns="http://www.w3.org/2000/svg" width="860" height="624" viewBox="0 0 860 624" role="img" aria-labelledby="serviceloop-arch-title serviceloop-arch-desc"><title id="serviceloop-arch-title">ServiceLoop architecture</title><desc id="serviceloop-arch-desc">Browser chat talks to a Node API; deterministic guards validate model output before touching the SQLite store; a worker delivers follow-ups.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    .box { fill: #ffffff; stroke: #0f3d5c; stroke-width: 2; }
    .title { font-size: 14px; font-weight: 700; fill: #0f3d5c; }
    .sub { font-size: 11px; fill: #3d4b55; }
    .lbl { font-size: 11px; fill: #0f3d5c; }
    .arrow { stroke: #0f3d5c; stroke-width: 1.6; fill: none; }
    .note { fill: #fdeee9; stroke: #ef5b45; stroke-width: 1.5; }
    .guard { fill: #e9eff4; stroke: #0f3d5c; stroke-width: 1.5; stroke-dasharray: 6 3; }
  </style>
  <rect class="box" rx="6" x="20" y="40" width="170" height="90"/>
  <text class="title" x="34" y="66">Browser chat UI</text>
  <text class="sub" x="34" y="84">React + Vite :5173</text>
  <text class="sub" x="34" y="100">simulated-workshop label</text>
  <text class="sub" x="34" y="116">text + voice-note upload</text>

  <rect class="box" rx="6" x="250" y="40" width="200" height="130"/>
  <text class="title" x="264" y="66">API :3101</text>
  <text class="sub" x="264" y="84">turns / proposals / confirm</text>
  <text class="sub" x="264" y="100">cancel / snooze / opt-out</text>
  <text class="sub" x="264" y="116">offers / feedback / inbox</text>
  <text class="sub" x="264" y="132">voice 501 until transcribe</text>
  <text class="sub" x="264" y="148">rules-demo or live model</text>

  <rect class="guard" rx="6" x="250" y="200" width="200" height="124"/>
  <text class="title" x="264" y="226">Deterministic guards</text>
  <text class="sub" x="264" y="244">Zod model-output schema</text>
  <text class="sub" x="264" y="260">constraint ledger revisions</text>
  <text class="sub" x="264" y="276">bay + driver solver, travel</text>
  <text class="sub" x="264" y="292">holds, approval tokens,</text>
  <text class="sub" x="264" y="306">idempotency, cancel tokens</text>

  <rect class="box" rx="6" x="510" y="40" width="330" height="130"/>
  <text class="title" x="524" y="66">Meta direct</text>
  <text class="sub" x="524" y="84">muse-spark-1.3 (routine)</text>
  <text class="sub" x="524" y="100">muse-wonder-1.0 (escalation)</text>
  <text class="sub" x="524" y="116">voice-transcribe-1.0 (ASR)</text>
  <text class="sub" x="524" y="132">one bounded repair,</text>
  <text class="sub" x="524" y="148">then human clarification</text>

  <rect class="box" rx="6" x="510" y="200" width="330" height="110"/>
  <text class="title" x="524" y="226">SQLite store (WAL)</text>
  <text class="sub" x="524" y="244">ledger entries (upsert)</text>
  <text class="sub" x="524" y="260">holds + bookings + jobs</text>
  <text class="sub" x="524" y="276">offers, approvals, reviews</text>
  <text class="sub" x="524" y="292">UTC storage, tz display</text>

  <rect class="box" rx="6" x="250" y="366" width="200" height="90"/>
  <text class="title" x="264" y="392">Follow-up worker</text>
  <text class="sub" x="264" y="410">leased ticks, bounded retries</text>
  <text class="sub" x="264" y="426">quiet hours, opt-out recheck</text>
  <text class="sub" x="264" y="442">browser-channel inbox only</text>

  <rect class="note" rx="6" x="510" y="366" width="330" height="90"/>
  <text class="title" x="524" y="392">Pending / labeled</text>
  <text class="sub" x="524" y="410">WhatsApp: no credentials</text>
  <text class="sub" x="524" y="426">live calls: no telephony</text>
  <text class="sub" x="524" y="442">demo data: all simulated</text>

  <path class="arrow" d="M190 85 H245"/>
  <path class="arrow" d="M450 85 H505"/>
  <path class="arrow" d="M350 170 V198"/>
  <path class="arrow" d="M470 250 H505"/>
  <path class="arrow" d="M350 324 V364"/>
  <rect x="203" y="64" width="34" height="15" fill="white"/><text class="lbl" x="206" y="76">POST</text>
  <rect x="465" y="64" width="34" height="15" fill="white"/><text class="lbl" x="468" y="76">chat</text>
  <rect x="283" y="180" width="63" height="15" fill="white"/><text class="lbl" x="286" y="192">validates</text>
  <rect x="469" y="229" width="56" height="15" fill="white"/><text class="lbl" x="472" y="241">persists</text>
  <rect x="287" y="336" width="70" height="15" fill="white"/><text class="lbl" x="290" y="348">polls jobs</text>

  <line x1="20" y1="576" x2="840" y2="576" stroke="#d9dee3" stroke-width="1"/>
  <rect x="20" y="588" width="14" height="14" fill="#ffffff" stroke="#0f3d5c" stroke-width="2"/>
  <text class="sub" x="40" y="600">component</text>
  <rect x="150" y="588" width="14" height="14" fill="#e9eff4" stroke="#0f3d5c" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text class="sub" x="170" y="600">deterministic guard</text>
  <rect x="330" y="588" width="14" height="14" fill="#fdeee9" stroke="#ef5b45" stroke-width="1.5"/>
  <text class="sub" x="350" y="600">pending / labeled</text>
  <line x1="520" y1="595" x2="560" y2="595" stroke="#0f3d5c" stroke-width="1.6"/>
  <text class="sub" x="566" y="600">calls / persists / polls</text>
</svg>
